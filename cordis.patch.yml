# dsh-window-position profile patch layer: one loader entry for the plugin
# package. The host half registers the /window-position/bounds loopback route;
# the browser half is picked up by dsh-client-modules through the package's
# dsh.client declaration, exactly like the shipped ui-* packages.
- insert:
    - id: dsh-window-position
      name: 'dsh-window-position'
